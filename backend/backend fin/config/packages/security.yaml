security:
    password_hashers:
        App\Entity\User: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false


        api:
            pattern: ^/api
            stateless: true
            

    # access_control:
    #     - { path: ^/api/login, roles: PUBLIC_ACCESS }
    #     - { path: ^/api/register, roles: PUBLIC_ACCESS }
    #     - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            App\Entity\User:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10